<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 40px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            color: #d1e8e2; font-family: 'Montserrat', sans-serif;
        }
        .content {
            background: rgba(255, 255, 255, 0.08);
            padding: 40px; border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 800px;
            display: flex; /* Ez rendezi egymás mellé a dolgokat */
            align-items: center; /* Függőlegesen középre igazít */
            gap: 30px; /* Távolság a kép és a szöveg között */
        }
        .left-side { flex: 0 0 250px; } /* Kép mérete */
        .right-side { text-align: left; }
        h1 { font-family: 'Grenze Gotisch', serif; font-size: 2.5rem; color: #a8dadc; margin: 0; }
        .hero-img { width: 100%; border-radius: 15px; border: 3px solid #a8dadc; }
        .highlight { color: #ff9f43; font-weight: bold; }
    </style>
</head>
<body>

    <div class="content">
        <div class="left-side">
            <img src="elodiedress.png" class="hero-img" alt="Elodie">
        </div>
        
        <div class="right-side">
            <h1>Northlight Animation</h1>
            <p><em>Mesék, amelyek fénybe öltöznek.</em></p>
            <p>Üdvözlünk a stúdióban! Ez egy egyéni 2D animációs műhely, amely a klasszikus, kézzel rajzolt animációk nosztalgikus hangulatát hozza vissza modern eszközökkel.</p>
            <p><strong>Aktuális projekt:</strong> Elodie és az Elveszett Hercegnők</p>
            <p class="highlight">Várható bemutató: 2028–2029</p>
        </div>
    </div>

</body>
</html>
