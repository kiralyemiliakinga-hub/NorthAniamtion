<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Sarki fény ihletésű színátmenet */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d1e8e2;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
        }
        .content {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-family: 'Grenze Gotisch', serif; /* Ez adja a mesekönyv stílust */
            font-size: 3.5rem;
            color: #a8dadc;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(168, 218, 220, 0.5);
        }
        img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 4px solid #a8dadc;
            margin: 20px 0;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Northlight Animation</h1>
        <img src="elodiedress.png" alt="Elodie">
        <p>Mesék, amelyek fénybe öltöznek.</p>
    </div>

</body>
</html>
